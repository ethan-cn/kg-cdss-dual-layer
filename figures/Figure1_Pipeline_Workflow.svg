<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" font-family="Helvetica, Arial, sans-serif" font-size="12">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
    <style>
      .title    { font-weight: bold; font-size: 13px; fill: #1a1a1a; }
      .stage    { font-weight: bold; font-size: 12px; fill: #ffffff; }
      .item     { font-size: 11px; fill: #1a1a1a; }
      .small    { font-size: 10px; fill: #555; font-style: italic; }
      .input    { fill: #E3F2FD; stroke: #1565C0; stroke-width: 1.5; }
      .stage1   { fill: #1565C0; stroke: #0D47A1; stroke-width: 1.5; }
      .stage1b  { fill: #BBDEFB; stroke: #1565C0; stroke-width: 1; }
      .stage2   { fill: #C62828; stroke: #8B0000; stroke-width: 1.5; }
      .overt    { fill: #FFCDD2; stroke: #C62828; stroke-width: 1; }
      .hidden   { fill: #FFE082; stroke: #F57F17; stroke-width: 1; }
      .output   { fill: #E8F5E9; stroke: #2E7D32; stroke-width: 1.5; }
      .normal   { fill: #4C9AFF; }
      .att      { fill: #FFAB00; }
      .crit     { fill: #DE350B; }
      .label    { fill: #ffffff; font-size: 10px; font-weight: bold; }
    </style>
  </defs>

  <!-- Input -->
  <rect class="input" x="15" y="120" width="100" height="80" rx="6"/>
  <text class="title" x="65" y="145" text-anchor="middle">Patient</text>
  <text class="title" x="65" y="161" text-anchor="middle">Lab Results</text>
  <text class="small" x="65" y="180" text-anchor="middle">T_p = {(τ, x)}</text>
  <text class="small" x="65" y="193" text-anchor="middle">n = 47,468</text>

  <!-- Stage 1 box -->
  <rect class="stage1b" x="140" y="60" width="285" height="200" rx="8"/>
  <rect class="stage1"  x="140" y="60" width="285" height="28" rx="8"/>
  <text class="stage" x="282" y="79" text-anchor="middle">Stage 1 — Multi-Authority Consensus (§3.2)</text>

  <!-- 9 authority chips -->
  <g transform="translate(155,100)">
    <rect width="38" height="20" rx="3" fill="#fff" stroke="#1565C0"/>
    <text class="item" x="19" y="14" text-anchor="middle">ADA</text>
    <rect x="44" width="38" height="20" rx="3" fill="#fff" stroke="#1565C0"/>
    <text class="item" x="63" y="14" text-anchor="middle">WHO</text>
    <rect x="88" width="38" height="20" rx="3" fill="#fff" stroke="#1565C0"/>
    <text class="item" x="107" y="14" text-anchor="middle">NICE</text>
    <rect x="132" width="38" height="20" rx="3" fill="#fff" stroke="#1565C0"/>
    <text class="item" x="151" y="14" text-anchor="middle">ESC</text>
    <rect x="176" width="50" height="20" rx="3" fill="#fff" stroke="#1565C0"/>
    <text class="item" x="201" y="14" text-anchor="middle">KDIGO</text>
    <rect x="232" width="38" height="20" rx="3" fill="#fff" stroke="#1565C0"/>
    <text class="item" x="251" y="14" text-anchor="middle">ATA</text>

    <rect y="28" width="38" height="20" rx="3" fill="#fff" stroke="#1565C0"/>
    <text class="item" x="19" y="42" text-anchor="middle">ETA</text>
    <rect x="44" y="28" width="60" height="20" rx="3" fill="#fff" stroke="#1565C0"/>
    <text class="item" x="74" y="42" text-anchor="middle">WHO-Hb</text>
    <rect x="110" y="28" width="38" height="20" rx="3" fill="#fff" stroke="#1565C0"/>
    <text class="item" x="129" y="42" text-anchor="middle">IFCC</text>
  </g>

  <text class="small" x="282" y="180" text-anchor="middle">Conservative escalation rule (Def. 1)</text>
  <text class="small" x="282" y="195" text-anchor="middle">Confidence C_final (Def. 2)  ·  95% CI (Def. 3)</text>
  <text class="small" x="282" y="210" text-anchor="middle">Output: c(t) ∈ {NORMAL, ATTENTION, CRITICAL}</text>
  <text class="small" x="282" y="225" text-anchor="middle">+ confidence ± CI</text>

  <!-- RAG output legend inside Stage 1 -->
  <circle class="normal" cx="180" cy="244" r="5"/>
  <text class="item" x="190" y="248">Normal</text>
  <circle class="att" cx="245" cy="244" r="5"/>
  <text class="item" x="255" y="248">Attention</text>
  <circle class="crit" cx="320" cy="244" r="5"/>
  <text class="item" x="330" y="248">Critical</text>

  <!-- Arrow Stage1 -> Stage2 -->
  <line x1="425" y1="160" x2="465" y2="160" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Stage 2 box -->
  <rect class="overt" x="470" y="60" width="285" height="200" rx="8" fill="#fff" stroke="#C62828" stroke-width="1.5"/>
  <rect class="stage2"  x="470" y="60" width="285" height="28" rx="8"/>
  <text class="stage" x="612" y="79" text-anchor="middle">Stage 2 — Dual-Layer Inference (§3.3)</text>

  <!-- Overt panel -->
  <rect class="overt" x="485" y="100" width="125" height="70" rx="6"/>
  <text class="title" x="547" y="120" text-anchor="middle" fill="#8B0000">Overt Layer</text>
  <text class="small" x="547" y="136" text-anchor="middle">CRITICAL-anchored</text>
  <text class="small" x="547" y="150" text-anchor="middle">8 rules · floor 0.70</text>
  <text class="small" x="547" y="163" text-anchor="middle">ceiling 0.95</text>

  <!-- Hidden panel -->
  <rect class="hidden" x="617" y="100" width="125" height="70" rx="6"/>
  <text class="title" x="679" y="120" text-anchor="middle" fill="#8B5A00">Hidden Layer</text>
  <text class="small" x="679" y="136" text-anchor="middle">ATTENTION-anchored</text>
  <text class="small" x="679" y="150" text-anchor="middle">7 rules · floor 0.50</text>
  <text class="small" x="679" y="163" text-anchor="middle">ceiling 0.75</text>

  <!-- Exclusion -->
  <rect x="485" y="185" width="257" height="60" rx="6" fill="#F5F5F5" stroke="#666"/>
  <text class="title" x="612" y="203" text-anchor="middle" fill="#333">Exclusion Mechanism (Theorem 1)</text>
  <text class="small" x="612" y="220" text-anchor="middle">If overt counterpart fires → suppress hidden;</text>
  <text class="small" x="612" y="234" text-anchor="middle">no disease label appears in both layers.</text>

  <!-- Arrow Stage2 -> Output -->
  <line x1="755" y1="160" x2="795" y2="160" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Output -->
  <rect class="output" x="800" y="100" width="95" height="120" rx="6"/>
  <text class="title" x="847" y="123" text-anchor="middle">Disease</text>
  <text class="title" x="847" y="138" text-anchor="middle">Risks</text>
  <text class="small" x="847" y="158" text-anchor="middle">OvertDiseaseRisk</text>
  <text class="small" x="847" y="173" text-anchor="middle">HiddenDiseaseRisk</text>
  <text class="small" x="847" y="195" text-anchor="middle">+ provenance</text>
  <text class="small" x="847" y="208" text-anchor="middle">(DOI chain)</text>

  <!-- Input arrow -->
  <line x1="115" y1="160" x2="138" y2="160" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Bottom note -->
  <text class="small" x="450" y="290" text-anchor="middle">Two-stage pipeline: classification (Stage 1) feeds disease inference (Stage 2) on a unified, authority-anchored semantic scale.</text>
</svg>
